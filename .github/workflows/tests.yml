# The unit tests that need no Isaac Sim: tests/ without tests/robot_tests (those start a simulator), on
# plain Python with CPU torch. PHYGS_SKIP_MISSING_ENV=1 makes a test that needs Isaac Lab or the robots'
# fetched assets skip (tests/conftest.py); the log lists every skip (-rs). The robot behaviour (the ladder)
# is not run here.
name: Unit tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install pytest pyyaml numpy scipy pillow aiohttp rerun-sdk usd-core warp-lang imageio imageio-ffmpeg
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Run the unit tests
        run: python -m pytest tests -q -rs -p no:cacheprovider --ignore=tests/robot_tests
        env:
          PHYGS_SKIP_MISSING_ENV: "1"
