# Robot UI episode in the Bear house (an episode spec, docs/world.md): retrieve
# the dark bottle from the kitchen island's bottom drawer, as dev_house_drawer, but with
# the UI's tier and grants: tier motion (Drive to look around) and only gt_localization (the page
# shows the true pose and maps the cameras' depth with it).
schema: 3
id: ui_house_drawer
scene:
  id: bear_loop_house  # The scene dataset's release (phygs.scene.fetch); 1.3.0: contents moved forward to 0.30 m behind the fronts.
  version: 1.3.0
  name: house
  ground: false  # The house has its own floors.
robot:
  model: spot  # phygs/robots/spot; the base spawns at the robot's own height.
  start: [10.14, 5.59, 0.0]  # x, y, heading [m, m, rad]; arm stowed; no collider at 0.02-1.2 m within 0.94 m.
task:
  goal: retrieve
  description: the dark bottle
  target: kitchen_island_compartment_0_item_1  # Scene name, for the evaluator; never shown on the page.
actions: motion
observations:
  camera_roles: [planning]  # The robot's arm-planning cameras (Spot: frontleft, frontright, hand).
  joint_state: true
  imu: false
grants: [gt_localization]
budget:
  sim_seconds: 900
seed: 0
