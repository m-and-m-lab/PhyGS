# The routines' strategy: what they try, in which order; one set for every scene. Where to stand
# in a scene is configs/stances/<scene>.yaml, robot facts (gripper geometry, stow postures) are in
# the robot's robot.yaml, and pass thresholds are in the robot tests' configs.
# navigate_to position [m] and heading [rad] tolerance at a stance: navigate_to's default 0.04 m.
# A narrow band keeps the open stance useful (with 0.08 m the base stopped where a drawer opened
# only 0.20 m, 2026-10-16); 0.03 m took up to 8 fine-approach moves at a stance (2026-10-27).
goal_tolerance: [0.04, 0.05]
# Each navigate_to attempt's own time limit [s]; a timed-out walk is issued again, up to walk_tries
# attempts (the follower can stand still just outside the tolerance; stances take 5-15 s).
walk_timeout_s: 60.0
walk_tries: 2
settle_seconds: 1.0  # Standing still after a walk, so the legs settle before the arm moves [s].
# Opening a drawer, the same for every drawer: the handle stays within this range ahead of the
# base centre [m]. Stand facing the drawer with its closed handle at the far end less the walk's
# position tolerance (1.10 m; the base stops within 1.07-1.13 m), and pull until the handle is at
# the near end, measured from where the base stopped (0.27-0.33 m; less if the travel is shorter).
# 1.13 m: the 30 deg pitched grasp's reach for the lowest handles (output_check/20261013-1410_arm_reach;
# a base stopped past it refused every grasp, 2026-10-16). 0.80 m: the wrist ends ~0.30 m behind the
# grip point, ~5 cm in front of the body (0.45 m); at 0.71-0.75 m it ended under the chest and no
# stow could start (2026-10-15).
grip_range_m: [0.80, 1.13]
# Reaching into an open drawer, the same for every drawer: the point the arm reaches in to (the
# target, or the place spot) this far ahead of the base centre [m] (0.94-0.95 in the grid and house
# drawers, where the picks and places work). That puts the body over the open drawer, which a
# sensed costmap marks occupied, so the walk first stops with the drawer's handle reach_in_clear_m
# ahead [m]: the padded outline's front (0.66 m) plus 0.05 m plus a 5 cm costmap cell. From there
# navigation's fine approach (Nav2 occupied_goal_reach, 0.35 m) makes the last bit.
reach_in_ahead_m: 0.95
reach_in_clear_m: 0.80
limit_margin_m: 0.01  # Stop this far [m] short of a slide's end.
stance_tries: 2  # Walk to the stance again when no handle pitch works from where the base stopped.
# Handle grasp pitches [deg] (gripper axis down about the bar), tried in order while the approach
# or the slide move is refused before moving; approach distances [m] along the gripper axis.
handle_pitch_deg: [30.0, 45.0, 15.0, 0.0]
handle_approach_m: [0.08, 0.06, 0.04]
# After letting go of the handle, the retreat: [move, distance [m]]; wrist_down (wrist -z),
# gripper_back (wrist -x), up (world z), forward (the gripper axis made horizontal). Off the bar
# and back until the jaw tip (0.016 m past the bar's axis) and the planner's padding are clear;
# the stow plans from there (2026-10-15: the gripper's surface-fitted planner spheres).
handle_release: [[wrist_down, 0.02], [gripper_back, 0.04]]
# Closing pushes with the closed gripper, stopped this far short of the bar [m], then backs off.
push_back_m: 0.04
push_release: [[gripper_back, 0.03], [up, 0.10]]
# Pick approaches tried in order: null is straight down; vectors are in the robot's frame (x
# forward, z up), tilted away from the robot.
pick_approaches: [null, [0.5, 0.0, -0.866], [0.7071, 0.0, -0.7071]]
grasp_yaws_deg: [0.0, -90.0, 90.0, 180.0]  # Rolls about the approach, tried in order.
approach_m: 0.19  # Straight in to a grasp or a place, and back out [m].
hold_seconds: 1.0  # Hold after the pick's lift before stowing [s].
place_clearance_m: 0.04  # Release the object this far above the surface [m].
place_wrist_height_m: 0.5  # place_upright turns the wrist top-down this far above the spot [m].
# A drawer place spot this far from the carcass front [m]: the opened moving jaw reaches toward the
# carcass and caught its front edge on the way back up when the box stood in the middle of a drawer
# opened 0.262 m (0.127 m from the carcass, 33 N, blocked; 0.138 m at 0.284 m brushed it at 2 N,
# 2026-10-25). The box keeps place_front_margin_m [m] from the drawer front.
place_carcass_clearance_m: 0.17
place_front_margin_m: 0.02
line_speed_m_s: 0.1  # Straight end-effector lines [m/s].
stow_tolerance_rad: 0.2  # Within this of the stow (every arm joint), leave it straight first [rad].
# look_at views [distance m, elevation deg], tried in order. Low handles and boxes (the house's
# bottom drawer) need the later, shallower views; place looks at a spot, e.g. an open drawer's floor.
look_views:
  handle: [[0.6, 60.0], [0.5, 45.0], [0.45, 45.0], [0.6, 30.0]]
  target: [[0.5, 60.0], [0.5, 45.0], [0.6, 60.0], [0.6, 75.0], [0.6, 30.0]]
  place: [[0.6, 75.0], [0.7, 60.0], [0.6, 60.0], [0.7, 45.0]]
