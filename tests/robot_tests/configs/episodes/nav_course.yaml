# Navigation rung (episodes/check_navigation.py): walk around a wall, to a heading, by velocity
# commands; a goal inside the wall and one inside a closed pen are refused. Nav2 on the known map.
schema: 3
id: nav_course
scene:
  id: nav_course
  ground: true  # The file has no floor of its own.
robot:
  model: spot  # phygs/robots/spot; the base spawns at the robot's own height.
  start: [0.0, 0.0, 0.0]  # x, y, heading [m, m, rad]; the arm starts stowed.
record_view: {eye: [-2.0, -5.0, 5.0], target: [1.8, -0.8, 0.0]}
task:
  goal: none
actions: [navigation, motion]  # Motion: the velocity-command case and the ownership check.
observations:
  cameras: []
  joint_state: true
  imu: false
grants: [gt_localization, known_map]
budget:
  sim_seconds: 600
seed: 7
