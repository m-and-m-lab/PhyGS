# Navigation rung in the house (episodes/check_navigation.py): a goal inside the kitchen island is
# refused, two goals reached, one cancelled. Nav2 on the known map.
schema: 3
id: nav_house
scene:
  id: bear_loop_house  # The scene dataset's release (phygs.scene.fetch); 1.3.0: contents moved forward to 0.30 m behind the fronts.
  version: 1.3.0
  name: house
  ground: false  # The house has its own floors.
robot:
  model: spot  # phygs/robots/spot; the base spawns at the robot's own height.
  start: [10.14, 5.59, 0.0]  # x, y, heading [m, m, rad]; arm stowed; no collider at 0.02-1.2 m within 0.94 m.
record_view: {eye: [13.5, 4.6, 2.3], target: [11.2, 6.3, 0.6]}
task:
  goal: none
actions: [navigation, motion]  # Motion: the ownership check (velocity refused while navigating).
observations:
  cameras: []
  joint_state: true
  imu: false
grants: [gt_localization, known_map]
budget:
  sim_seconds: 400
seed: 7
