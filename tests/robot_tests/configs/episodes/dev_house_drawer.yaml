# Robot-test episode: retrieve the bottle from the kitchen island's bottom drawer (closed at the start;
# the file has the bottle there, beside a rolling pin).
schema: 3
id: dev_house_drawer
scene:
  id: bear_loop_house  # The scene dataset's release (phygs.scene.fetch); 1.3.0: contents moved forward to 0.30 m behind the fronts.
  version: 1.3.0
  name: house
  ground: false  # The house has its own floors.
robot:
  model: spot  # phygs/robots/spot; the base spawns at the robot's own height.
  start: [10.14, 5.59, 0.0]  # x, y, heading [m, m, rad]; arm stowed; no collider at 0.02-1.2 m within 0.94 m.
record_view: {eye: [13.5, 4.6, 2.3], target: [11.2, 6.3, 0.6]}  # Clear line of sight to the island.
task:
  goal: retrieve
  description: the dark bottle
  target: kitchen_island_compartment_0_item_1  # Scene name; agents see it only with object_targets.
actions: skills
observations:
  camera_roles: [planning]  # The robot's arm-planning cameras (Spot: frontleft, frontright, hand).
  joint_state: true
  imu: false
grants: [gt_localization, object_targets, scene_hints]
budget:
  sim_seconds: 600
seed: 0
