# check_manipulation.py: the robot is --robot (default spot: phygs/robots/spot/robot.yaml); these are the check's moves,
# thresholds, inspection camera and third-person view.
check:
  settling_seconds: 1.0
  move_seconds: 3.0
  # The arm raised is the robot's planning.default_joints; the sweep turns its first joint from there.
  sweep_first_joint_rad: 0.35
  wrist_offset_world_m: [0.0, 0.0, 0.025]
  maximum_tilt_gravity_z: -0.85  # A robot that can fall: below its fallen_height or tilted.
  maximum_cancel_drift_rad: 0.05
  reset_tolerance_rad: 0.01
camera:
  period: 0.032
  eye: [2.0, -2.0, 1.65]
  target: [0.2, 0.0, 0.65]
sensors:
  cameras:
    inspection:
      prim_path: "{ENV_REGEX_NS}/Robot/{base_link}/ObservationCamera"  # On the robot's base link.
      width: 640
      height: 480
      data_types: [rgb, distance_to_image_plane]
      offset: {pos: [0.85, 0.0, 0.35], rot: [0.0, 0.0, 0.0, 1.0], convention: world}
      pinhole: {focal_length: 18.0, horizontal_aperture: 20.955, clipping_range: [0.05, 20.0]}
