# episodes/check_dynamic_obstacle.py (spec nav_dynamic). From the component check's mapping.yaml
# (2026-10-26; removed 2026-10-28); the course is tests/robot_tests/scenes/dynamic_course (the box starts parked at (1.5, 3.3)).
goal: [3.0, 0.0, 0.0]  # x, y [m], heading [rad]: straight ahead, past where the box will be.
budget_s: 60.0  # The walk must end within this [s simulated].
blocked_position: [1.8, 0.0, 0.6]  # The box moves here the moment the walk starts [m].
sample_period_s: 0.2  # How often the costmap at the box is read [s].
stopped_speed_mps: 0.08  # After the walk ends (PointNavigationTask.stopped_speed).
# Then a box put in view and taken away must appear in, then clear from, Nav2's costmap.
clearing:
  turn_yaw_radps: 0.5
  turn_seconds: 3.14  # A quarter turn at 0.5 rad/s: facing +y, away from the far wall.
  stop_seconds: 1.0
  heading_tolerance_rad: 0.4
  distance_m: 2.2  # The box's centre ahead of the robot [m].
  parked_position: [-2.0, -3.0, 0.6]  # Where the box goes when taken away [m].
  wait_seconds: 3.0  # Each change must reach the costmap within this [s].
