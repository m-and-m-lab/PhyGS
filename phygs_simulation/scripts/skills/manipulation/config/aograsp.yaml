# Host-exposed defaults. Environment overrides still win:
# AO_POINTSCORE_URL=http://127.0.0.1:18081 AO_CGN_URL=http://127.0.0.1:18082
pointscore_url: http://127.0.0.1:18081
cgn_url: http://127.0.0.1:18082
timeout_s: 30.0
debug_root: /workspace/isaaclab/outputs/ao-grasp

# Must match AO_GRASP_EXPECTED_POINTS for both AO-Grasp sidecars.
total_points: 16384
rng_seed: 0
max_depth_m: 3.5
reference_prim_path: "{ENV_REGEX_NS}/Robot/body"

fusion_frame:
  mode: body_aligned_stereo_midpoint
  name: front_center
  left_camera_name: frontleft
  right_camera_name: frontright

pointcloud_filter:
  # Reference-frame filter applied after RGB-D projection and before AO-Grasp sampling.
  min_z_m: -0.48
  bounds_min:
  bounds_max:
  voxel_size_m: 0.01

# Optional debug-only visualization path:
# output/point_score/<request_id>.npz
# output/point_score_img/heatmap_<request_id>.png
# output/grasp_proposals_img/<request_id>.png
proposal_viz:
  enabled: true
  output_root: /workspace/isaaclab/outputs/ao-grasp
  viz_top_k: 10
